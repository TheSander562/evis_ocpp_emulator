name: Build and push Docker images

on:
  push:
    branches: ['**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./back_end
          - name: ui
            context: ./UI

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # 4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # 6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.name }}
          tags: |
            # Feature branches
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}

            # Stable releases
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

            # Latest stable
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

            # Pre-release
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' && github.event.release.prerelease }}

            # Latest pre-release
            type=raw,value=pre-release,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}


      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # 7.4.0
        with:
          context: ${{ matrix.context }}
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
