name: Build and push Docker images

on:
  push:
    branches: ['**']
    paths:
      - 'back_end/**'
      - '!back_end/**.md'
      - 'UI/**'
      - '!UI/**.md'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dir: ./back_end
            pm: pnpm
          - name: ui
            dir: ./UI
            pm: yarn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm }} install --frozen-lockfile

      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm }} run lint

      - name: Type check
        working-directory: ${{ matrix.dir }}
        run: npx tsc --noEmit -p ${{ matrix.name == 'ui' && 'tsconfig.app.json' || 'tsconfig.json' }}

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: evis_ocpp_emulator-backend
            context: ./back_end
          - name: evis_ocpp_emulator-ui
            context: ./UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # 4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # 4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # 4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # 6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            # Feature branches
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}

            # Stable releases
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

            # Latest stable
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

            # Pre-release
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' && github.event.release.prerelease }}

            # Latest pre-release
            type=raw,value=pre-release,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}


      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # 7.4.0
        with:
          context: ${{ matrix.context }}
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Multi arch not working with actions/delete-package-versions@v5
      - name: Delete untagged image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ matrix.name }}
          delete-untagged: true
          validate: true
