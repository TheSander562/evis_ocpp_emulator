services:
  ocpp-mongodb:
    image: mongo:8.3
    container_name: ocpp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ocpp_emulator}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db # Persist MongoDB data
      - mongo_config:/data/configdb # Persist MongoDB configuration
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocpp-backend:
    image: ghcr.io/thesander562/evis_ocpp_emulator-backend:main
    container_name: ocpp-backend
    restart: unless-stopped
    depends_on:
      ocpp-mongodb:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-example}@ocpp-mongodb:27017/${MONGO_DB:-ocpp_emulator}?authSource=admin
      MONGO_DB: ${MONGO_DB:-ocpp_emulator}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - ocpp-back_end_data:/app
      - ocpp-back_end_data/node_modules:/app/node_modules


  ocpp-ui:
    image: ghcr.io/thesander562/evis_ocpp_emulator-ui:main
    container_name: ocpp-ui
    restart: unless-stopped
    depends_on:
      - ocpp-backend
    ports:
      - '${UI_PORT:-5173}:5173'
    volumes:
      - ocpp-ui_data:/app
      - ocpp-ui_data/node_modules:/app/node_modules

volumes:
  mongo_data:
  mongo_config:
  ocpp-back_end_data:
  ocpp-ui_data:
